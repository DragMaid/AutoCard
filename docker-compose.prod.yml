# Production stack: the two long-running processes of docs/BACKEND.md plus the
# built client, run from the images CI pushes to GHCR. The dev equivalent is
# `./server/dev.sh` plus `npm run dev`.
#
# It lives on the VPS at /opt/autocard next to a .env the deploy workflow writes
# — see deploy/.env.example for every variable. Nothing here publishes a port:
# the host's Traefik (installed by deploy/ansible) terminates TLS and finds the
# relay and the client through the labels below, on its shared Docker network,
# so this stack shares 80/443 with the other sites on the machine.
#
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f engine

name: autocard

x-logging: &logging
  # Capped per container, so a noisy service cannot fill the disk the other
  # sites share. The engine is chatty: every intent and every patch.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The source of truth. Never published and not on the Traefik network — only
  # the relay may reach it, which is what keeps an authoritative engine safe to
  # run in public.
  #
  # Its entrypoint downloads the checkpoint and exits non-zero if it cannot, so
  # the engine only ever becomes healthy with a model in place — and the relay
  # below waits for exactly that before it accepts a single connection.
  engine:
    image: ${IMAGE_PREFIX:?}/autocard-engine:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      AUTOCARD_ENGINE_HOST: 0.0.0.0
      AUTOCARD_ENGINE_PORT: "9000"
      # Longer than a redeploy takes, so a match survives the relay reconnecting.
      AUTOCARD_ROOM_TTL: ${AUTOCARD_ROOM_TTL:-300}
      AUTOCARD_AI_DELAY: ${AUTOCARD_AI_DELAY:-0.8}
      AUTOCARD_AI_DEVICE: cpu
      AUTOCARD_CHECKPOINT: /models/autocard-bot.pth
      AUTOCARD_WEIGHTS_URL: ${AUTOCARD_WEIGHTS_URL:-https://huggingface.co/jakekato/AutoCard/resolve/main/autocard-bot.pth}
      # Optional: pin the exact weights. Set it and a corrupted or swapped file
      # is refused instead of loaded.
      AUTOCARD_WEIGHTS_SHA256: ${AUTOCARD_WEIGHTS_SHA256:-}
      # Escape hatch for a box that should run without a trained AI at all;
      # unset in production, where a missing checkpoint must fail the rollout.
      AUTOCARD_SKIP_WEIGHTS: ${AUTOCARD_SKIP_WEIGHTS:-0}
      # Only needed while the model repository is private.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
      - engine-logs:/app/logs
    networks: [default]
    logging: *logging

  # Rooms, seats and fan-out. Decides nothing about the game.
  relay:
    image: ${IMAGE_PREFIX:?}/autocard-relay:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      AutoCard__EngineUri: ws://engine:9000
      # Narrowed from the development default of "*": the browser bundle is
      # served from one origin and nothing else needs to reach the relay.
      AutoCard__AllowedOrigins__0: https://${SITE_DOMAIN:?}
      AutoCard__ReconnectGraceSeconds: ${RECONNECT_GRACE_SECONDS:-90}
      AutoCard__MaxRooms: ${MAX_ROOMS:-500}
    depends_on:
      engine:
        condition: service_healthy
    # default to reach the engine, traefik to be reached.
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.services.autocard-relay.loadbalancer.server.port: "8080"
      # The socket.io WebSocket endpoint, on the same hostname as the client.
      # Its rule is longer than the client's catch-all, so Traefik ranks it first.
      traefik.http.routers.autocard-relay.rule: Host(`${SITE_DOMAIN:?}`) && PathPrefix(`/socket.io/`)
      traefik.http.routers.autocard-relay.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.autocard-relay.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.autocard-relay.service: autocard-relay
      # `curl https://<domain>/relay-health` — the relay's own status, room
      # count included. deploy.sh checks it; the client never calls it.
      traefik.http.routers.autocard-relay-health.rule: Host(`${SITE_DOMAIN:?}`) && Path(`/relay-health`)
      traefik.http.routers.autocard-relay-health.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.autocard-relay-health.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.autocard-relay-health.middlewares: autocard-relay-health
      traefik.http.routers.autocard-relay-health.service: autocard-relay
      traefik.http.middlewares.autocard-relay-health.replacepath.path: /health
    logging: *logging

  # The built client: static files behind a small nginx, which also sets the
  # cache headers (see deploy/web.Dockerfile).
  web:
    image: ${IMAGE_PREFIX:?}/autocard-web:${IMAGE_TAG:?}
    restart: unless-stopped
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.services.autocard-web.loadbalancer.server.port: "80"
      traefik.http.routers.autocard-web.rule: Host(`${SITE_DOMAIN:?}`)
      traefik.http.routers.autocard-web.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.autocard-web.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.autocard-web.service: autocard-web
    logging: *logging

networks:
  default: {}
  # Created by the Ansible playbook, shared with Traefik and the other sites.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  # The checkpoint, downloaded once and kept across releases.
  models:
  engine-logs:
