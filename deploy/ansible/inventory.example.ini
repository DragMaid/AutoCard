# Copy to inventory.ini (gitignored) and fill in. Run as a user with sudo:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory.ini playbook.yml

[autocard]
vps ansible_host=example_ip ansible_user=root

[autocard:vars]
# The one public hostname: the client and the relay's /socket.io/ both live here.
autocard_domain=autocard.example.com
letsencrypt_email=you@example.com
deploy_public_key_file=~/.ssh/autocard-deploy.pub
# letsencrypt (default) needs DNS for the name already pointing at the VPS.
tls_mode=selfsigned
# Must match RELAY_PORT / WEB_PORT in the server's .env.
relay_port=8180
web_port=3200
